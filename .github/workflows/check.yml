name: Validate Gursha
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/app.js
      - run: node --check public/engine.js
      - run: node --check public/guidance.js
      - run: node --check public/portions.js
      - run: node --check public/planner.js
      - run: node --check public/vault.js
      - run: node --check public/sw.js
      - run: node --test tests/*.test.mjs
